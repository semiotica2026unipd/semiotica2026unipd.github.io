name: Pubblica il sito

on:
  push:
    branches: [main, fix/quarto-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Genera tutte le pagine dai sorgenti
        run: quarto render
      - name: Verifica pagine e PDF pubblicati
        run: |
          for page in index calendario overview lezioni dispensa lavoro-di-gruppo esame supporto; do
            test -s "_site/$page.html"
          done
          test "$(find _site -type f -name '*.pdf' | wc -l)" -eq 6
          cmp dispensa/introduzione.pdf _site/dispensa/introduzione.pdf
          for file in lezione-1.pptx lezione-1.pdf lezioni-2-3.pdf lezioni-4-5.pdf esercizio.pdf esercizio2.pdf; do
            cmp "materiali/$file" "_site/materiali/$file"
          done
          test "$(find _site/dispensa -type f -name '*.pdf' | wc -l)" -eq 1
          for page in index calendario overview lezioni dispensa lavoro-di-gruppo esame supporto; do
            grep -q '<meta name="robots" content="noindex, nofollow">' "_site/$page.html"
          done
          test ! -e _site/sitemap.xml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
