project:
  type: website
  output-dir: _site
  pre-render:
    - python3 scripts/calendario.py
    - python3 scripts/news.py
  post-render:
    - python3 scripts/noindex.py
  render:
    - index.qmd
    - calendario.qmd
    - overview.qmd
    - lavoro-di-gruppo.qmd
    - lezioni.qmd
    - dispensa.qmd
    - esame.qmd
    - supporto.qmd
  resources:
    - assets/
    - dispensa/introduzione.pdf
    - materiali/lezione-1.pptx
    - materiali/lezione-1.pdf
    - materiali/lezioni-2-3.pdf
    - materiali/lezioni-4-5.pdf
    - materiali/esercizio.pdf
    - materiali/esercizio2.pdf

lang: it

website:
  title: "Semiotica e teoria della comunicazione"
  site-url: https://semiotica2026unipd.github.io/
  favicon: favicon.svg
  search: false
  sidebar:
    id: corso
    logo: assets/semiotica.png
    logo-alt: "Semiotica e teoria della comunicazione"
    background: "#339898"
    foreground: "#ffffff"
    style: docked
    align: center
    pinned: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Home
      - href: overview.qmd
        text: Overview
      - href: lezioni.qmd
        text: Lezioni
      - href: dispensa.qmd
        text: Dispensa
      - href: lavoro-di-gruppo.qmd
        text: Lavoro di gruppo
      - href: esame.qmd
        text: Esame
      - href: supporto.qmd
        text: Supporto

format:
  html:
    theme:
      - cosmo
      - theme.scss
    css: styles.css
    include-in-header: _includes/noindex.html
    toc: false
    anchor-sections: true
    link-external-newwindow: true
    grid:
      sidebar-width: 260px
      body-width: 1200px
      margin-width: 0px
      gutter-width: 1.5rem
